<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin drop: impact form study</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e7e5e1;--panel:#f4f3f1;--ink:#2a2a28;--muted:#6f6c66;--line:#d3d0ca;--water:#3f6f86;--coin:#c9a24a;--ground:#c4baa9;--pit:#a39a8c;--accent:#8a6f4e;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1c;--panel:#282725;--ink:#e8e5e0;--muted:#a19c93;--line:#3b3935;--water:#6f9fb5;--coin:#d4ae55;--ground:#8f8779;--pit:#5f584e;--accent:#b99a73;}}
:root[data-theme="dark"]{--bg:#1f1e1c;--panel:#282725;--ink:#e8e5e0;--muted:#a19c93;--line:#3b3935;--water:#6f9fb5;--coin:#d4ae55;--ground:#8f8779;--pit:#5f584e;--accent:#b99a73;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden}
#view{flex:1;position:relative;min-width:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.title{position:absolute;left:20px;top:16px;pointer-events:none;max-width:60ch}
.title h1{font-stretch:75%;font-weight:700;font-size:2rem;line-height:1;margin:0;letter-spacing:-.01em}
.title p{margin:.35rem 0 0;color:var(--muted);font-size:.9rem}
#stat{position:absolute;left:20px;bottom:14px;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
aside{width:300px;background:var(--panel);border-left:1px solid var(--line);padding:18px 18px 24px;overflow-y:auto}
aside h2{font-size:.95rem;font-weight:600;margin:1.2rem 0 .6rem}
aside h2:first-child{margin-top:0}
label.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.85rem;margin-bottom:.7rem}
label.row output{color:var(--muted);font-variant-numeric:tabular-nums}
label.row input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:.7rem}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.4rem}
.actions button{font:inherit;font-size:.9rem;padding:10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.actions .primary{grid-column:1/-1;background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:600;font-size:1rem;padding:12px}
.actions .primary:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.note{font-size:.78rem;color:var(--muted);line-height:1.45;margin:.8rem 0 0}
@media (max-width:760px){
 body{flex-direction:column}
 aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:46%;padding:14px 16px 18px}
 .title h1{font-size:1.5rem}.title{left:14px;top:10px}.title p{display:none}
 #stat{left:14px;bottom:8px}
}
aside{display:flex;flex-direction:column;padding:0 !important;overflow:hidden !important}
.groups{flex:1;overflow-y:auto;padding:8px 18px 12px}
.dock{border-top:1px solid var(--line);padding:12px 18px 14px}
.dock .actions{margin-top:0}
.dock .note:empty{display:none}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;font-weight:600;font-size:.95rem;padding:12px 0;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grp{padding:2px 0 10px}
@media (prefers-reduced-motion:reduce){summary::after{transition:none}}
.seg.four{grid-template-columns:repeat(4,1fr)}
#tl{position:absolute;left:20px;right:20px;bottom:12px;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
#tl input{flex:1;accent-color:var(--accent)}
#tl span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:9ch;text-align:right}
#tl:not([hidden])~#stat,#stat:has(~#tl:not([hidden])){bottom:62px}
#matrow[hidden]{display:none}
</style></head>
<body>
<div id="view">
 <div id="stat"></div>
 <div id="tl" hidden><input id="tlr" type="range" min="0" max="0" step="1" value="0" aria-label="Timeline"><span id="tltime"></span></div>
</div>
<aside>
 <div class="groups">
 <details open><summary>Medium</summary><div class="grp">
 <div class="seg four" role="group" aria-label="Medium"><button data-med="0" aria-pressed="true">Water</button><button data-med="1" aria-pressed="false">Viscous</button><button data-med="2" aria-pressed="false">Sand</button><button data-med="3" aria-pressed="false">Clay</button></div>
 <label class="row" id="matrow"><span id="matlabel">Viscosity</span><output id="o-mat"></output><input id="mat" type="range" min="0" max="1" step="0.01" value="0.5"></label>
 </div></details>
 <details open><summary>Coins</summary><div class="grp">
 <label class="row">Number of coins<output id="o-cnt"></output><input id="cnt" type="range" min="1" max="12" step="1" value="5"></label>
 <label class="row">Smallest diameter<output id="o-dmin"></output><input id="dmin" type="range" min="0.06" max="0.22" step="0.005" value="0.09"></label>
 <label class="row">Largest diameter<output id="o-dmax"></output><input id="dmax" type="range" min="0.06" max="0.22" step="0.005" value="0.16"></label>
 <label class="row">Weight<output id="o-wgt"></output><input id="wgt" type="range" min="1.5" max="12" step="0.5" value="7"></label>
 </div></details>
 <details open><summary>Drop</summary><div class="grp">
 <label class="row">Height above ground<output id="o-hgt"></output><input id="hgt" type="range" min="0.05" max="2.5" step="0.01" value="0.6"></label>
 <label class="row">Maximum tilt<output id="o-tlt"></output><input id="tlt" type="range" min="0" max="80" step="1" value="30"></label>
 <label class="row">Scatter<output id="o-sct"></output><input id="sct" type="range" min="0" max="1.6" step="0.05" value="0.8"></label>
 <label class="row">Time between drops<output id="o-int"></output><input id="int" type="range" min="0" max="0.6" step="0.02" value="0.12"></label>
 <div class="actions"><button id="shuffle" style="grid-column:1/-1">Shuffle layout</button></div>
 </div></details>
 <details><summary>Pit</summary><div class="grp">
 <p class="note" style="margin:0 0 .6rem">6 m deep, filled to the brim.</p>
 <label class="row">Pit diameter<output id="o-pr"></output><input id="pr" type="range" min="0.12" max="0.42" step="0.01" value="0.26"></label>
 </div></details>
 <details><summary>Crown</summary><div class="grp">
 <label class="row">Surface tension<output id="o-sig"></output><input id="sig" type="range" min="0" max="0.03" step="0.001" value="0"></label>
 <label class="row">Crown fingers<output id="o-fng"></output><input id="fng" type="range" min="4" max="32" step="1" value="16"></label>
 <label class="row">Finger strength<output id="o-fst"></output><input id="fst" type="range" min="0" max="2" step="0.05" value="0"></label>
 </div></details>
 <details><summary>Site and simulation</summary><div class="grp">
 <div class="seg" role="group" aria-label="Container"><button id="c-open" aria-pressed="true">Open pit</button><button id="c-tube" aria-pressed="false">Tube</button></div>
 <div class="seg three" role="group" aria-label="Resolution"><button data-n="40" aria-pressed="false">Draft</button><button data-n="48" aria-pressed="true">Standard</button><button data-n="60" aria-pressed="false">Fine</button></div>
 <label class="row">Simulation speed<output id="o-spd"></output><input id="spd" type="range" min="1" max="60" step="1" value="20"></label>
 </div></details>
 </div>
 <div class="dock">
 <div class="actions">
  <button id="drop" class="primary">Drop coins</button>
  <button id="pause">Pause</button>
  <button id="reset">Reset</button>
  <button id="export" style="grid-column:1/-1">Export frame for Rhino</button>
 </div>
 <p class="note" id="note" aria-live="polite"></p>
 </div>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ---------- MLS-MPM water + many rigid coins, two-way coupled ----------
function createSim(N, geo) {
  geo = geo || { R: 0.26, depth: 0.24, water: 0.75 };
  const DX = 1 / N, INV = N, E = 300, G = 9.8;
  const DT = 0.35 * DX / Math.sqrt(E);
  const PVOL = Math.pow(DX * 0.55, 3), PMASS = PVOL;
  const PB = 0.06, R = geo.R, GY = PB + geo.depth, WL = PB + geo.water * geo.depth;
  const H = Math.max(1, geo.H || 1), NY = Math.ceil(N * H), HY = NY / N;
  const NN = N * NY * N;
  const gm = new Float32Array(NN), gx = new Float32Array(NN), gy = new Float32Array(NN), gz = new Float32Array(NN);
  const nodeFlag = new Uint8Array(NN), nodeN = new Float32Array(NN * 3);
  let P = 0, px, py, pz, vx, vy, vz, C, Jp, spd;
  let tube = false, time = 0, stepCount = 0, dropTime = -1;
  let coins = [], contacted = false;

  // desert terrain: height above the pit rim level, flattened near the pit
  function dune(x, z) {
    const t = x * 1.8 + 0.22 * Math.sin(z * 4.0) + 0.35 * z;
    return 0.028 * Math.pow(Math.abs(Math.sin(Math.PI * t)), 1.6) + 0.007 * Math.sin(5.3 * z + 2 * x) + 0.004 * Math.sin(11 * x - 7 * z) + 0.01;
  }
  function terrainY(x, z) {
    const r = Math.hypot(x - 0.5, z - 0.5);
    let k = (r - R - 0.015) / 0.12; k = k < 0 ? 0 : k > 1 ? 1 : k; k = k * k * (3 - 2 * k);
    return GY + k * dune(x, z);
  }
  function envSdf(x, y, z) {
    const r = Math.hypot(x - 0.5, z - 0.5);
    const col = Math.min(R - r, y - PB);
    return tube ? col : Math.max(col, (y - terrainY(x, z)) * 0.9);
  }
  function envNormal(x, y, z, out) {
    const e = 1e-3;
    const nx = envSdf(x + e, y, z) - envSdf(x - e, y, z);
    const ny = envSdf(x, y + e, z) - envSdf(x, y - e, z);
    const nz = envSdf(x, y, z + e) - envSdf(x, y, z - e);
    const l = Math.hypot(nx, ny, nz) || 1;
    out[0] = nx / l; out[1] = ny / l; out[2] = nz / l;
  }
  const tmpN = [0, 0, 0];
  function buildNodes() {
    nodeFlag.fill(0);
    for (let i = 0; i < N; i++) for (let j = 0; j < NY; j++) for (let k = 0; k < N; k++) {
      const x = i * DX, y = j * DX, z = k * DX, d = envSdf(x, y, z);
      if (d < DX * 0.5) {
        const id = (i * NY + j) * N + k;
        nodeFlag[id] = d < -1.5 * DX ? 2 : 1;
        envNormal(x, y, z, tmpN);
        nodeN[id * 3] = tmpN[0]; nodeN[id * 3 + 1] = tmpN[1]; nodeN[id * 3 + 2] = tmpN[2];
      }
    }
  }
  function resetWater() {
    const s = DX * 0.55, pts = [];
    for (let x = 0.5 - R; x <= 0.5 + R; x += s)
      for (let z = 0.5 - R; z <= 0.5 + R; z += s) {
        if (Math.hypot(x - 0.5, z - 0.5) > R - s * 0.6) continue;
        for (let y = PB + s * 0.6; y < WL; y += s)
          pts.push(x + (Math.random() - 0.5) * 0.2 * s, y + (Math.random() - 0.5) * 0.2 * s, z + (Math.random() - 0.5) * 0.2 * s);
      }
    P = pts.length / 3;
    px = new Float32Array(P); py = new Float32Array(P); pz = new Float32Array(P);
    vx = new Float32Array(P); vy = new Float32Array(P); vz = new Float32Array(P);
    C = new Float32Array(P * 9); Jp = new Float32Array(P).fill(1); spd = new Float32Array(P);
    for (let p = 0; p < P; p++) { px[p] = pts[3 * p]; py[p] = pts[3 * p + 1]; pz[p] = pts[3 * p + 2]; }
    time = 0; dropTime = -1; contacted = false;
  }

  // ---- rigid coin helpers ----
  function quatToMat(q, m) {
    const [x, y, z, w] = q;
    m[0] = 1 - 2 * (y * y + z * z); m[1] = 2 * (x * y - z * w); m[2] = 2 * (x * z + y * w);
    m[3] = 2 * (x * y + z * w); m[4] = 1 - 2 * (x * x + z * z); m[5] = 2 * (y * z - x * w);
    m[6] = 2 * (x * z - y * w); m[7] = 2 * (y * z + x * w); m[8] = 1 - 2 * (x * x + y * y);
  }
  function Iinv(cn, v, out) {
    const m = cn.Rm;
    const b0 = (m[0] * v[0] + m[3] * v[1] + m[6] * v[2]) / cn.Ib[0];
    const b1 = (m[1] * v[0] + m[4] * v[1] + m[7] * v[2]) / cn.Ib[1];
    const b2 = (m[2] * v[0] + m[5] * v[1] + m[8] * v[2]) / cn.Ib[2];
    out[0] = m[0] * b0 + m[1] * b1 + m[2] * b2;
    out[1] = m[3] * b0 + m[4] * b1 + m[5] * b2;
    out[2] = m[6] * b0 + m[7] * b1 + m[8] * b2;
  }
  const omega = (cn, out) => Iinv(cn, cn.L, out);
  function discSdf(cn, lx, ly, lz) {
    const q = Math.hypot(lx, lz) - cn.a, ay = Math.abs(ly) - cn.h / 2;
    return Math.hypot(Math.max(q, 0), Math.max(ay, 0)) + Math.min(Math.max(q, ay), 0);
  }
  function discNormalWorld(cn, lx, ly, lz, out) {
    const e = DX * 0.2, m = cn.Rm;
    let nx = discSdf(cn, lx + e, ly, lz) - discSdf(cn, lx - e, ly, lz);
    let ny = discSdf(cn, lx, ly + e, lz) - discSdf(cn, lx, ly - e, lz);
    let nz = discSdf(cn, lx, ly, lz + e) - discSdf(cn, lx, ly, lz - e);
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    out[0] = m[0] * nx + m[1] * ny + m[2] * nz; out[1] = m[3] * nx + m[4] * ny + m[5] * nz; out[2] = m[6] * nx + m[7] * ny + m[8] * nz;
  }
  function toLocal(cn, x, y, z, out) {
    const m = cn.Rm, rx = x - cn.c[0], ry = y - cn.c[1], rz = z - cn.c[2];
    out[0] = m[0] * rx + m[3] * ry + m[6] * rz; out[1] = m[1] * rx + m[4] * ry + m[7] * rz; out[2] = m[2] * rx + m[5] * ry + m[8] * rz;
  }
  function sampleWorld(cn, s, out) {
    const m = cn.Rm, lx = s[0] * cn.a, ly = s[1] * cn.h / 2, lz = s[2] * cn.a;
    out[0] = m[0] * lx + m[1] * ly + m[2] * lz; out[1] = m[3] * lx + m[4] * ly + m[5] * lz; out[2] = m[6] * lx + m[7] * ly + m[8] * lz;
  }
  const samples = [];
  for (let k = 0; k < 12; k++) { const t = k / 12 * Math.PI * 2; samples.push([Math.cos(t), 1, Math.sin(t)], [Math.cos(t), -1, Math.sin(t)]); }
  samples.push([0, 1, 0], [0, -1, 0], [0.5, 1, 0], [-0.5, 1, 0], [0, 1, 0.5], [0, 1, -0.5], [0.5, -1, 0], [-0.5, -1, 0], [0, -1, 0.5], [0, -1, -0.5]);

  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // o: {count, dmin, dmax, weight, height, tilt, scatter, interval, seed}
  function setCoins(o) {
    const rand = rng(o.seed), h = Math.max(1.3 * DX, 0.028);
    const dmin = Math.min(o.dmin, o.dmax), dmax = Math.max(o.dmin, o.dmax);
    coins = [];
    const order = [];
    for (let i = 0; i < o.count; i++) {
      const a = (dmin + (dmax - dmin) * rand()) / 2;
      const M = o.weight * Math.PI * a * a * h;
      const cn = { a, h, M, Ib: [M * (3 * a * a + h * h) / 12, M * a * a / 2, M * (3 * a * a + h * h) / 12],
        c: [0.5, GY + o.height, 0.5], v: [0, 0, 0], L: [0, 0, 0], q: [0, 0, 0, 1], Rm: new Float64Array(9), dropped: false, release: 0, trail: [] };
      // fixed random draws per coin, so moving Scatter only scales the same pattern outward
      const ur = Math.sqrt((i + 0.5) / o.count) * (0.85 + 0.15 * rand()), uth = i * 2.39996 + rand() * 0.6;
      let maxR = Math.min(o.scatter * R, 0.5 - a - 2.5 * DX);
      if (tube) maxR = Math.min(maxR, Math.max(0, R - a - 0.01));
      const x = 0.5 + ur * maxR * Math.cos(uth), z = 0.5 + ur * maxR * Math.sin(uth);
      // coins that would overlap in plan are lifted above the ones below them
      let y = GY + o.height;
      const lift = 0.05 + 2 * dmax / 2 * Math.sin(o.tilt * Math.PI / 180);
      for (let pass = 0; pass < 2; pass++) for (const b of coins)
        if (Math.hypot(b.c[0] - x, b.c[2] - z) < b.a + a + 0.01 && Math.abs(b.c[1] - y) < lift) y = b.c[1] + lift;
      cn.c = [x, y, z];
      const t = o.tilt * Math.PI / 180 * (0.4 + 0.6 * rand()), ax = rand() * Math.PI * 2;
      const ux = Math.cos(ax), uz = Math.sin(ax), st = Math.sin(t / 2);
      cn.q = [ux * st, 0, uz * st, Math.cos(t / 2)];
      quatToMat(cn.q, cn.Rm);
      coins.push(cn); order.push(i);
    }
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    order.forEach((ci, k) => { coins[ci].release = k * o.interval; });
    dropTime = -1; contacted = false;
  }

  const w = [0, 0, 0], tmp = [0, 0, 0], n3 = [0, 0, 0], loc = [0, 0, 0], rv = [0, 0, 0];
  function coupleCoin(cn) {
    const m = cn.Rm, c = cn.c, v = cn.v;
    omega(cn, w);
    const ext = cn.a + 2 * DX, band = DX * 0.75;
    const i0 = Math.max(0, Math.floor((c[0] - ext) * INV)), i1 = Math.min(N - 1, Math.ceil((c[0] + ext) * INV));
    const j0 = Math.max(0, Math.floor((c[1] - ext) * INV)), j1 = Math.min(NY - 1, Math.ceil((c[1] + ext) * INV));
    const k0 = Math.max(0, Math.floor((c[2] - ext) * INV)), k1 = Math.min(N - 1, Math.ceil((c[2] + ext) * INV));
    let Jx = 0, Jy = 0, Jz = 0, Tx = 0, Ty = 0, Tz = 0;
    if (j0 > j1) return;
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) for (let k = k0; k <= k1; k++) {
      const id = (i * NY + j) * N + k, mass = gm[id];
      if (mass <= 0) continue;
      const rx = i * DX - c[0], ry = j * DX - c[1], rz = k * DX - c[2];
      const lx = m[0] * rx + m[3] * ry + m[6] * rz, ly = m[1] * rx + m[4] * ry + m[7] * rz, lz = m[2] * rx + m[5] * ry + m[8] * rz;
      if (discSdf(cn, lx, ly, lz) > band) continue;
      discNormalWorld(cn, lx, ly, lz, n3);
      const nx = n3[0], ny = n3[1], nz = n3[2];
      const ux = v[0] + w[1] * rz - w[2] * ry, uy = v[1] + w[2] * rx - w[0] * rz, uz = v[2] + w[0] * ry - w[1] * rx;
      const vn = (gx[id] - ux) * nx + (gy[id] - uy) * ny + (gz[id] - uz) * nz;
      if (vn >= 0) continue;
      const dvx = -vn * nx, dvy = -vn * ny, dvz = -vn * nz;
